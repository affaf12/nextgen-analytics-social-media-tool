name: Ping HF Space (keep-alive)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          if [ -z "${{ vars.HF_SPACE_URL }}" ]; then
            echo "HF_SPACE_URL variable not set — skipping."
            exit 0
          fi
          curl -sSf "${{ vars.HF_SPACE_URL }}/docs" -o /dev/null || echo "Ping failed (Space may be cold-starting)."
