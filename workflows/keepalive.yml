name: Ping HF Space (keep-alive)

# Optional: free Hugging Face Spaces "sleep" after a long period of no traffic.
# Yeh workflow har 30 minute mein Space ko ek halka GET request bhejta hai taake
# woh active rahe. 100% guarantee nahi hai (HF maintenance/rebuild ke waqt phir
# bhi restart ho sakta hai), lekin normal sleep-due-to-inactivity ko rokta hai.
#
# Setup: Settings > Secrets and variables > Actions > Repository variables mein
# HF_SPACE_URL set karo, e.g. https://yourusername-affaf-crm-backend.hf.space

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          if [ -z "${{ vars.HF_SPACE_URL }}" ]; then
            echo "HF_SPACE_URL variable not set — skipping."
            exit 0
          fi
          curl -sSf "${{ vars.HF_SPACE_URL }}/docs" -o /dev/null || echo "Ping failed (Space may be cold-starting)."
